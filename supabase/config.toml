# Minimal Supabase CLI config (used by `supabase link`, `db push`, `functions deploy`).
project_id = "watchlist-app"

# Auth is checked inside the function (requireUser), compatible with new JWT signing keys.
[functions.tmdb]
verify_jwt = false

[functions.imdb]
verify_jwt = false

# Called by GitHub Actions (x-cron-secret) and by calendar apps (token in URL): no Supabase JWT.
[functions.series-tracker]
verify_jwt = false

[functions.calendar]
verify_jwt = false

# Cron (x-cron-secret) or a logged-in user (checked in code).
[functions.discovery-media]
verify_jwt = false

[functions.availability]
verify_jwt = false

[functions.discovery-music]
verify_jwt = false

[functions.notify-email]
verify_jwt = false
